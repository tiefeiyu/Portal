[project]
name = "portal-mcp"
version = "0.1.0"
description = "MCP server for interactive processes — SSH, GDB, REPLs, database CLIs, and full-screen TUIs"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",       # code targets the 1.x API (list_tools decorators)
    "aiosqlite>=0.22.1",
    "pyte>=0.8.2",
    "pywinpty>=3.0.5 ; sys_platform == 'win32'",
    "ptyprocess ; sys_platform != 'win32'",
]

[project.scripts]
portal-mcp = "portal_mcp.server:main"

# PEP 735 dev group. `uv sync` and `uv run` include it by default, so the
# documented test command works in a fresh checkout. Without it, `uv run
# pytest` finds no pytest in the project environment and silently falls
# back to whatever pytest happens to be on PATH, running the tests against
# an unrelated interpreter.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",    # asyncio_mode = "auto" below requires it
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
